<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Dashboard</title>

    <style>
     pre {
      background-color: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #dee2e6;
      white-space: pre-wrap;
    }
      </style>
      <!-- Bootstrap CSS CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <nav class="navbar">
        <div class="logo">Seek My Shop</div>
        <ul class="nav-links">
          <li><a href="#">Dashboard</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="logout.html">Logout</a></li>
        </ul>
    </nav>

    <div class="form-container" style="text-align: center;">
        <h2>Welcome to Your Dashboard</h2>
        <div id="userInfo">
            <p>Loading user information...</p>
        </div>
        <p>You are successfully logged in!</p>
        <button id="logoutButton" onclick="location.href='logout.html'">Logout</button>
    </div>

    <!-- ******************************************-->
   
<nav class="navbar navbar-dark bg-dark mb-4">
    <a class="navbar-brand" href="#">Brand Dashboard</a>
  </nav>
  
  <div class="container">
    <h2>📥 Add / Update Brand</h2>
    <form id="brandForm">
      <div class="form-row">
        <div class="form-group col-md-2">
          <input type="number" class="form-control" id="brandId" placeholder="ID (for Update)">
        </div>
        <div class="form-group col-md-4">
          <input type="text" class="form-control" id="brandName" placeholder="Brand Name" required>
        </div>
        <div class="form-group col-md-4">
          <input type="text" class="form-control" id="brandDesc" placeholder="Brand Description">
        </div>
        <div class="form-group col-md-2">
          <button type="submit" class="btn btn-success btn-block">Submit</button>
        </div>
      </div>
    </form>
  
    <h2>🔍 Brand List</h2>
    <div class="mb-3">
      <button class="btn btn-primary" onclick="fetchBrands()">GET Brands</button>
    </div>
  
    <div>
      <pre id="api-response">Click GET to load brand data...</pre>
    </div>
  </div>
  
  <script>
    const baseURL = '/brands/';
  
    function fetchBrands() {
      fetch(baseURL)
        .then(response => response.json())
        .then(data => {
          document.getElementById('api-response').textContent = JSON.stringify(data, null, 2);
        })
        .catch(err => alert('Error fetching brands: ' + err));
    }
  
    document.getElementById('brandForm').addEventListener('submit', function (e) {
      e.preventDefault();
  
      const id = document.getElementById('brandId').value;
      const brandName = document.getElementById('brandName').value;
      const brandDesc = document.getElementById('brandDesc').value;
  
      const data = {
        brand_name: brandName,
        brand_description: brandDesc || null,
      };
  
      const method = id ? 'PUT' : 'POST';
      const url = id ? `${baseURL}${id}/` : baseURL;
  
      fetch(url, {
        method: method,
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(data),
      })
        .then(res => res.json())
        .then(response => {
          alert(`Brand ${id ? 'updated' : 'created'} successfully!`);
          fetchBrands();
        })
        .catch(err => alert('Error: ' + err));
    });
  
    function deleteBrand(id) {
      if (!confirm(`Are you sure you want to delete brand with ID ${id}?`)) return;
  
      fetch(`${baseURL}${id}/`, {
        method: 'DELETE',
      })
        .then(res => {
          if (res.status === 204) {
            alert(`Brand ${id} deleted successfully.`);
            fetchBrands();
          } else {
            alert('Failed to delete brand.');
          }
        })
        .catch(err => alert('Error deleting brand: ' + err));
    }
  </script>
  
    
    <!-- ******************************************-->

    <script src="../JavaScript/auth.js"></script>
    <script src="../JavaScript/dashboard.js"></script>
    <!-- Bootstrap JS Bundle CDN (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
