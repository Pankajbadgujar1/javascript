<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Seek My Shop</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    
    <link rel="stylesheet" href="../CSS/dashboard.css">
    
</head>
<body>
    <nav class="navbar">
        <div class="logo">Seek My Shop</div>
        <ul class="nav-links">
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="logout.html">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card text-center">
            <h2 class="mb-4">Welcome to Your Dashboard</h2>
            
            <div id="userInfo">
                <p>Loading user information...</p>
            </div>
            
            <p>You are successfully logged in!</p>
            <button id="logoutButton" onclick="location.href='logout.html'" class="btn btn-danger">Logout</button>
        </div>
        
        <div class="card">
            <h2 class="mb-4">Brand Management</h2>
            
            <div id="brandForm" class="mb-4">
                <h4 class="mb-3">Add/Update Brand</h4>
                <form>
                    <input type="hidden" id="brandId">
                    <div class="mb-3">
                        <input type="text" id="brandName" class="form-control" placeholder="Brand Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" id="brandDesc" class="form-control" placeholder="Brand Description">
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <button type="button" onclick="resetForm()" class="btn btn-secondary ms-2">Cancel</button>
                </form>
            </div>
            
            <h4 class="mb-3">All Brands</h4>
            <div class="table-container">
                <table id="brandsTable" class="table table-striped table-hover" style="width:100%">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Brand Name</th>
                            <th>Brand Description</th>
                            <th>Brand Logo</th>
                            <th>Update</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    
    <!-- Your custom JS -->
    <script src="../JavaScript/auth.js"></script>
    <script src="../JavaScript/dashboard.js"></script>
</body>
</html>
