<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Dashboard</title>

    <style>
     pre {
      background-color: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #dee2e6;
      white-space: pre-wrap;
    }
      </style>
      <!-- Bootstrap CSS CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <nav class="navbar">
        <div class="logo">Seek My Shop</div>
        <ul class="nav-links">
          <li><a href="#">Dashboard</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="logout.html">Logout</a></li>
        </ul>
    </nav>

    <div class="form-container" style="text-align: center;">
        <h2>Welcome to Your Dashboard</h2>
        <!-- <div id="userInfo">
            <p>Loading user information...</p>
        </div> -->
        <p>You are successfully logged in!</p>
        <button id="logoutButton" onclick="location.href='logout.html'">Logout</button>
    </div>

    <!-- ******************************************-->

  <nav class="navbar navbar-dark bg-dark mb-4">
    <a class="navbar-brand mx-3" href="#">Brand Dashboard</a>
  </nav>

  <div class="container">
    <h2>📥 Add / Update Brand</h2>
    <form id="brandForm" class="mb-4">
      <div class="row g-3">
        <div class="col-md-2">
          <input type="number" class="form-control" id="brandId" placeholder="ID (for Update)">
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control" id="brandName" placeholder="Brand Name" required>
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control" id="brandDesc" placeholder="Brand Description">
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-success w-100">Submit</button>
        </div>
      </div>
    </form>

    <h2>🔍 Brand Operations</h2>
    <div class="mb-3 d-flex flex-wrap gap-2">
      <button class="btn btn-primary" onclick="fetchBrands()">GET All Brands</button>
      <input type="number" id="getId" class="form-control w-auto" placeholder="ID for GET Specific">
      <button class="btn btn-info" onclick="getBrandById()">GET Specific Brand</button>
      <input type="number" id="deleteId" class="form-control w-auto" placeholder="ID for DELETE">
      <button class="btn btn-danger" onclick="deleteBrandById()">DELETE Brand</button>
    </div>

    <h3>🧾 API Response</h3>
    <pre id="api-response" class="bg-light p-3 rounded border">Click a button to see API response...</pre>
  </div>


  
    <!-- ******************************************-->

    <script src="../JavaScript/auth.js"></script>
    <script src="../JavaScript/dashboard.js"></script>
    <!-- Bootstrap JS Bundle CDN (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
