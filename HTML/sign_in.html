      <h1>SignIn Page</h1>


    <div class="form-container">
        <h2>SignIn</h2>
        <form id="signinForm">
            
            <label for="email">Email Address :</label>
            <input type="email" id="email" placeholder="ex.abc@gmail.com" required><br>
            <!-- Adding a new class for errors handling-->
            <div class="error" id="emailError"></div>

            <label for="password">Password :</label>
            <input type="password" id="password" placeholder="*******" required><br><br>
            <!-- Adding a new class for eSrrors handling-->
            <div class="error" id="passError"></div>

            <input type="button" value="Submit" onclick="SignInForm()">

            <button type="reset">Cancel</button>

            
        </form>
    </div>
    <!-- Run files on 'python -m http.server 5500' this localhost "http://localhost:5500/HTML/sign_in.html" path -->
</body>
<script src="../JavaScript/auth.js"></script>
<script src="../JavaScript/sign_in.js"></script>
